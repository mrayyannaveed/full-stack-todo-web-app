openapi: 3.0.0
info:
  title: Todo CLI Internal API
  description: Internal API for the Todo CLI application
  version: 1.0.0
paths:
  /tasks:
    get:
      summary: List all tasks
      description: Retrieve a list of all tasks for the current user
      responses:
        '200':
          description: A list of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
    post:
      summary: Create a new task
      description: Create a new task with the provided details
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Invalid input
  /tasks/{id}:
    get:
      summary: Get a specific task
      description: Retrieve a specific task by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Task details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          description: Task not found
    put:
      summary: Update a task
      description: Update an existing task with the provided details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: Task updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          description: Task not found
        '400':
          description: Invalid input
    delete:
      summary: Delete a task
      description: Delete a specific task by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '204':
          description: Task deleted successfully
        '404':
          description: Task not found
  /tasks/{id}/complete:
    post:
      summary: Mark task as complete
      description: Mark a specific task as completed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Task marked as complete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          description: Task not found
  /tasks/{id}/incomplete:
    post:
      summary: Mark task as incomplete
      description: Mark a specific completed task as incomplete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Task marked as incomplete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          description: Task not found
  /tasks/search:
    get:
      summary: Search tasks
      description: Search tasks by title or ID
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
          description: Search query (ID or title)
        - name: search_by
          in: query
          required: false
          schema:
            type: string
            enum: [id, title, id_or_title]
          description: How to search (default: id_or_title)
      responses:
        '200':
          description: List of matching tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '400':
          description: Invalid search parameters
components:
  schemas:
    Task:
      type: object
      required:
        - id
        - title
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int32
          description: Sequential numeric ID for the task
        title:
          type: string
          description: Title of the task
        description:
          type: string
          description: Optional description of the task
          nullable: true
        status:
          type: string
          enum: [pending, completed]
          description: Completion status of the task
        priority:
          type: string
          enum: [High, Medium, Low]
          description: Priority level of the task
          nullable: true
        due_date:
          type: string
          format: date
          description: Due date of the task in YYYY-MM-DD format
          nullable: true
        created_at:
          type: string
          format: date-time
          description: Timestamp when the task was created
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the task was last updated
    CreateTaskRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          description: Title of the task
          example: "Complete project"
        description:
          type: string
          description: Optional description of the task
          example: "Finish the project documentation"
          nullable: true
        priority:
          type: string
          enum: [High, Medium, Low]
          description: Priority level of the task
          example: "Medium"
        due_date:
          type: string
          format: date
          description: Due date of the task in YYYY-MM-DD format
          example: "2025-12-31"
          nullable: true
    UpdateTaskRequest:
      type: object
      properties:
        title:
          type: string
          description: Updated title of the task
          example: "Complete project"
        description:
          type: string
          description: Updated description of the task
          example: "Finish the project documentation"
          nullable: true